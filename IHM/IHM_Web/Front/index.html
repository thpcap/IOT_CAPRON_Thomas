<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8">
    <title>IOT_Capteurs</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header><h1>TempHumiX</h1></header>
    <main>
      <div id="options">
        <div id="detectSensors"><input type="checkbox" name="detectSensors" id="detectSensorsCb">Detecter automatiquement les Capteurs</div>
      </div>
      <form id="commandForm">
        <h2>Capteurs</h2>
        <table>
          <thead>
            <tr>
              <th></th>
              <th>Id</th>
              <td>Nom</td>
              <th>Numéro de serie</th>
              <th>Version</th>
              <th>Est Autoimporté</th>
              <th colspan="2">Actions</th>
            </tr>
          </thead>
          <tbody id="capteurList">
            <tr class="capt_42900">
              <td><input type="checkbox" name="Capteurs" id="" value="42900"></td>
              <td class="capt_id">1</td>
              <td class="capt_sn">42900</td>
              <td class="capt_v">V1.1</td>
              <td>False</td>
              <td>
                <a onclick="">Voir le graphique</a>
              </td>
            </tr>
            
          </tbody>
        </table>
        <div id="graphiqueContainer" style="display: none;">

            <h2>
                Historique du capteur
                <span id="graphiqueSN"></span>
            </h2>

            <div class="graphique-wrapper">
                <canvas id="sensorChart"></canvas>
            </div>

        </div>

        
        <div>
          <h2>Envoyer une commande</h2>
          <div>
            <select name="commande" id="commande" onchange="activerNombre()">
                <option value="" selected></option>
                <option value="1">Mise à l'heure du capteur</option>
                <option value="2">Démarrage des mesures</option>
                <option value="3">Arrêt des mesures</option>
                <option value="4">Clignotement lent</option>
                <option value="5">Clignotement rapide</option>
                <option value="6" data-min="2">Clignotement personnalisé</option>
                <option value="7" data-min="0" data-max="1023">Écriture du bargraphe</option>
                <option value="8">Afficher l'identifiant sur les bargraph</option>
            </select>
            <input type="number" name="value" id="value" disabled></input>
            <button type="submit">Envoyer</button>
          </div>
        </div>
      </form>
      <section class="sensor-form-container">
          <h2>Ajouter un capteur</h2>

          <form id="sensorForm">

              <div class="form-group">
                  <label for="serialnumber">Numéro de série</label>
                  <input
                      type="text"
                      id="serialnumber"
                      name="serialnumber"
                      placeholder="Ex : 42900"
                      required
                  >
              </div>

              <div class="form-group">
                  <label for="name">Nom du capteur</label>
                  <input
                      type="text"
                      id="name"
                      name="name"
                      placeholder="Ex : Capteur salle serveur"
                  >
              </div>

              <button type="submit">Ajouter le capteur</button>

              <p id="sensorMessage"></p>

          </form>
      </section>
    </main>
    <footer>
      Thomas CAPRON
      <!-- Chart.js -->
      <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

      <!-- Luxon -->
      <script src="https://cdn.jsdelivr.net/npm/luxon@3.5.0/build/global/luxon.min.js"></script>

      <!-- Adaptateur de dates -->
      <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>

      <!-- Ton fichier graphique -->
      <script src="js/graph.js"></script>
      <script>
        const API_URL = "http://localhost:8000";
      </script>
      <script src="js/inputs.js"></script>
      <script src="js/sensors.js"></script>
      <script src="js/command.js"></script>
    </footer>
  </body>
</html>
